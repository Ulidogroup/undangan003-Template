<!doctype html><html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Undangan Charles & Eva</title>
    <style>*{box-sizing:border-box}html,
      body{margin:0;min-height:100%;font-family:Georgia,serif;background:#6d1020}
  .cover {
  position: relative;

  /* Ukuran gambar mengikuti layar */
  width: min(100%, 540px);
  aspect-ratio: 1080 / 1920;

  /* Posisi rata tengah */
  margin: 0 auto;

  /* Gambar tetap proporsional */
  background-image: url('assets/cover.webp');
  background-position: center center;
  background-size: contain;
  background-repeat: no-repeat;}
      .guest{position:absolute;left:32%;width:36%;top:75.0%;height:7.9%;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#921a1a;font-size:clamp(12px,3.2vw,20px);font-weight:bold;overflow-wrap:anywhere;line-height:1.25}
      .open{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;border:1px solid #d6a800;border-radius:40px;background:#a31919;color:#fff6d7;padding:14px 26px;font-size:16px;box-shadow:0 5px 20px #0006;cursor:pointer;white-space:nowrap}
      .open:focus-visible{outline:3px solid #e8c34a;outline-offset:3px}.content{display:none;min-height:100vh;text-align:center;padding:80px 20px;background:#6d1020;color:#fff0e0}
      .content.visible{display:block}
      .cover.hidden{display:none}@media(min-width:540px){.guest{font-size:19px}}
      html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background-color: #6d1020;}

/* Posisi cover di tengah layar */
body:has(.cover:not(.hidden)) main {
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;}

/* Responsif untuk semua ukuran HP */
@media (max-width: 600px) {
  .cover {
    width: min(100vw, 56.25dvh);  }}
    </style>
  </head>
  <body>
    <main>
      <section class="cover" id="cover" aria-label="Cover undangan"><div class="guest" id="guest"></div></section>
      <section class="content" id="content"><h1>Charles &amp; Eva</h1><p>Selamat datang di undangan kami.</p><p>Halaman isi undangan akan dibuat pada tahap berikutnya.</p></section>
    </main>
    <button class="open" id="open" type="button">✉ Buka Undangan</button>
    <audio id="music" loop preload="none" src="assets/musik.mp3"></audio>
    <script>const params=new URLSearchParams(location.search);const guest=document.getElementById('guest');guest.textContent=params.get('to')||'Nama Tamu Undangan';function fit(){let size=innerWidth>=540?19:Math.min(20,innerWidth*.032);guest.style.fontSize=size+'px';while((guest.scrollHeight>guest.clientHeight||guest.scrollWidth>guest.clientWidth)&&size>10){size-=.5;guest.style.fontSize=size+'px'}}addEventListener('resize',fit);fit();document.getElementById('open').addEventListener('click',()=>{const audio=document.getElementById('music');audio.play().catch(()=>{});document.getElementById('cover').classList.add('hidden');document.getElementById('content').classList.add('visible');document.getElementById('open').remove();window.scrollTo(0,0)});
    </script>
  </body>
</html>
